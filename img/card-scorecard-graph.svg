<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%">
  <!-- Background Sheet -->
  <rect x="6" y="6" width="268" height="168" rx="6" fill="#FFFFFF" stroke="#14140F" stroke-width="2.5"/>

  <!-- Top Yellow Header Strip -->
  <rect x="6" y="6" width="268" height="32" fill="#FFD000" rx="3"/>
  <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#14140F">SCORECARD &amp; ALL-INDIA RANK</text>

  <!-- Percentile Badge Box -->
  <g transform="translate(18, 48)">
    <rect width="115" height="65" rx="4" fill="#E0F8E9" stroke="#00C853" stroke-width="2"/>
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#0E7036">DEMO PERCENTILE</text>
    <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#0E7036">99.84</text>
  </g>

  <!-- All India Rank Box -->
  <g transform="translate(145, 48)">
    <rect width="115" height="65" rx="4" fill="#FAF9F6" stroke="#14140F" stroke-width="2"/>
    <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#7E7E73">ESTIMATED AIR</text>
    <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#14140F">~2,140</text>
  </g>

  <!-- Bell Curve Graphic -->
  <g transform="translate(18, 122)">
    <line x1="0" y1="36" x2="242" y2="36" stroke="#14140F" stroke-width="2"/>
    <path d="M0,36 Q80,36 120,6 Q160,36 240,36" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="120" cy="6" r="4" fill="#FFD000" stroke="#14140F" stroke-width="1.5"/>
    <text x="135" y="10" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#2563EB">CUTOFF 90%ILE</text>
  </g>
</svg>
